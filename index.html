<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>เกมหนูน้อย</title>
  <meta name="description" content="เกมฝึกสมองสำหรับเด็ก: นับเลข จับคู่ภาพ ทายสี และ ก-ฮ">
  <meta name="theme-color" content="#ff8a3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เกมหนูน้อย">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn hidden" aria-label="กลับหน้าหลัก">🏠</button>
    <h1 id="title">เกมหนูน้อย</h1>
    <button id="playerBtn" class="player-chip hidden" aria-label="เปลี่ยนผู้เล่น"></button>
    <div class="stars" aria-label="คะแนน">⭐ <span id="stars">0</span></div>
    <button id="soundBtn" class="icon-btn" aria-label="เปิด/ปิดเสียง">🔊</button>
  </header>

  <main id="app">
    <section id="menu" class="screen">
      <p class="hello">เลือกเกมที่อยากเล่นเลย!</p>
      <div class="menu-grid">
        <button class="game-card c1" data-game="count"><span class="big">🍎</span>นับเลข</button>
        <button class="game-card c2" data-game="memory"><span class="big">🃏</span>จับคู่ภาพ</button>
        <button class="game-card c3" data-game="color"><span class="big">🎨</span>ทายสี</button>
        <button class="game-card c4" data-game="thai"><span class="big">ก</span>ก ไก่ - ฮ นกฮูก</button>
        <button class="game-card c5" data-game="math"><span class="big">➕</span>บวกลบเลข</button>
        <button class="game-card c6" data-game="shape"><span class="big">🔺</span>รูปทรง</button>
        <button class="game-card c7" data-game="slide"><span class="big">🧩</span>สไลด์ภาพ</button>
        <button class="game-card c8" id="rankCard"><span class="big">🏆</span>ผู้เล่น & คะแนน</button>
      </div>
      <button id="installBtn" class="install hidden">📲 ติดตั้งลงเครื่อง</button>
    </section>

    <section id="players" class="screen hidden">
      <p class="hello">🏆 ตารางคะแนน</p>
      <ol id="rankList" class="rank-list"></ol>
      <div class="new-player">
        <h3 id="newPlayerTitle">เพิ่มผู้เล่นใหม่</h3>
        <input id="nameInput" maxlength="12" placeholder="พิมพ์ชื่อของหนู" autocomplete="off" enterkeyhint="done">
        <div id="avatarPick" class="avatar-pick"></div>
        <button id="addPlayerBtn" class="btn primary">✅ เริ่มเล่นเลย</button>
      </div>
    </section>

    <section id="levels" class="screen hidden">
      <p class="hello">เลือกด่าน</p>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <section id="result" class="screen hidden">
      <div class="result-card">
        <div id="resultEmoji" class="result-emoji">🏆</div>
        <h2 id="resultTitle">ผ่านด่านแล้ว!</h2>
        <div id="resultStars" class="result-stars">⭐⭐⭐</div>
        <p id="resultText"></p>
        <div class="result-btns">
          <button id="nextLevelBtn" class="btn primary">ด่านต่อไป ▶</button>
          <button id="replayBtn" class="btn">🔁 เล่นอีกครั้ง</button>
          <button id="levelsBtn" class="btn">📋 เลือกด่าน</button>
        </div>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <div class="progress">
        <span id="levelLabel" class="level-label"></span>
        <div id="dots" class="dots"></div>
      </div>
      <div id="prompt" class="prompt"></div>
      <div id="board" class="board"></div>
      <div id="choices" class="choices"></div>
    </section>
  </main>

  <div id="cheer" class="cheer hidden"></div>

  <script src="app.js"></script>
</body>
</html>
